# SPDX-License-Identifier: GPL-3.0-only WITH GPL-3.0-linking-exception
# Tagged release: builds every package on Ubuntu with M-VAVE's Build.ps1
# and JieLi's Linux toolchain, uploads packages, SHA-256 sidecars,
# provenance and the corresponding source archive for every package, then
# triggers the install site. Packages are installed through M-VAVE's hosted
# workbench (open.m-vave.com); the vendor's embedded-installer HTML build is
# Windows-only and is not produced here.
#
# Tag with: git tag v1.0.0 && git push origin v1.0.0
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        board: [fm1, smk37]
        stage: [1, 2, 3, 4]
        model: [elite]
        include:
          # The SMK-37 Pro shares the source; build it too so Pro owners get a package.
          - { board: smk37, stage: 1, model: pro }
          - { board: smk37, stage: 2, model: pro }
          - { board: smk37, stage: 3, model: pro }
          - { board: smk37, stage: 4, model: pro }
    env:
      PAIR: ${{ matrix.board }}-s${{ matrix.stage }}${{ matrix.board == 'smk37' && format('-{0}', matrix.model) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lessons, tree, audit
        run: |
          python3 tools/make_lessons.py
          python3 tools/overlay.py --board ${{ matrix.board }} --stage ${{ matrix.stage }} --model ${{ matrix.model }} --host-os linux --out build/trees/$PAIR
          python3 tools/audit_safety.py --tree build/trees/$PAIR
      - name: Toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.jieli
          key: jieli-linux-${{ hashFiles('tools/ci/jieli-linux.sha256') }}
      - name: JieLi Linux toolchain
        run: tools/ci/get_linux_toolchain.sh ~/.jieli
      - name: Build firmware (FM-1)
        if: matrix.board == 'fm1'
        shell: pwsh
        working-directory: build/trees/${{ env.PAIR }}
        run: ./sdk/Build.ps1 -FirmwareOnly -Toolchain $env:FM1_PI32_TOOLCHAIN
      - name: Build firmware (SMK-37)
        if: matrix.board == 'smk37'
        shell: pwsh
        working-directory: build/trees/${{ env.PAIR }}
        run: ./sdk/Build.ps1 -Model ${{ matrix.model }} -FirmwareOnly -Toolchain $env:FM1_PI32_TOOLCHAIN
      - name: Collect, hash, provenance
        run: |
          python3 tools/collect_packages.py --board ${{ matrix.board }} --stage ${{ matrix.stage }} --model ${{ matrix.model }} --out dist
          python3 tools/verify_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.PAIR }}
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true
      - name: Release notes
        run: |
          {
            echo "## Learning firmware pairs ${{ github.ref_name }}"
            echo
            echo "Verify every download: \`sha256sum -c <file>.sha256\`. Read SAFETY.md before installing."
            echo
            echo "| Package | SHA-256 |"; echo "| --- | --- |"
            for f in all/*.fwsc; do echo "| $(basename "$f") | $(cut -d' ' -f1 "$f.sha256") |"; done
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            all/*.fwsc
            all/*.sha256
            all/*.provenance.json
            all/*-source.tar.gz
