# SPDX-License-Identifier: GPL-3.0-only WITH GPL-3.0-linking-exception
# Device firmware on Ubuntu: M-VAVE's own Build.ps1 (under pwsh) with JieLi's
# Linux toolchain, the same clang 4.0.1 for pi32v2 that the Windows kit
# ships, published by JieLi as a plain tarball. No installer, no secrets.
# tools/overlay.py --host-os linux adjusts only tool file names in the
# assembled copy of Build.ps1 (audited); every SDK hash check stays on.
#
# The toolchain tarball is pinned by SHA-256 in tools/ci/jieli-linux.sha256.
# On the very first run that file is empty: the job prints the hash and
# fails; commit the hash and re-run.
name: firmware
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        board: [fm1, smk37]
        stage: [1, 2, 3, 4]
        model: [elite]
        include:
          - { board: smk37, stage: 1, model: pro }
          - { board: smk37, stage: 2, model: pro }
          - { board: smk37, stage: 3, model: pro }
          - { board: smk37, stage: 4, model: pro }
    env:
      PAIR: ${{ matrix.board }}-s${{ matrix.stage }}${{ matrix.board == 'smk37' && format('-{0}', matrix.model) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lessons, tree, audit
        run: |
          python3 tools/make_lessons.py
          python3 tools/overlay.py --board ${{ matrix.board }} --stage ${{ matrix.stage }} --model ${{ matrix.model }} --host-os linux --out build/trees/$PAIR
          python3 tools/audit_safety.py --tree build/trees/$PAIR
      - name: Toolchain cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.jieli
          key: jieli-linux-${{ hashFiles('tools/ci/jieli-linux.sha256') }}
      - name: JieLi Linux toolchain
        run: tools/ci/get_linux_toolchain.sh ~/.jieli
      - name: Build firmware (FM-1)
        if: matrix.board == 'fm1'
        shell: pwsh
        working-directory: build/trees/${{ env.PAIR }}
        run: ./sdk/Build.ps1 -FirmwareOnly -Toolchain $env:FM1_PI32_TOOLCHAIN
      - name: Build firmware (SMK-37)
        if: matrix.board == 'smk37'
        shell: pwsh
        working-directory: build/trees/${{ env.PAIR }}
        run: ./sdk/Build.ps1 -Model ${{ matrix.model }} -FirmwareOnly -Toolchain $env:FM1_PI32_TOOLCHAIN
      - name: Collect, hash, provenance
        run: python3 tools/collect_packages.py --board ${{ matrix.board }} --stage ${{ matrix.stage }} --model ${{ matrix.model }} --out dist
      - name: Verify
        run: python3 tools/verify_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.PAIR }}
          path: dist/
          if-no-files-found: error
