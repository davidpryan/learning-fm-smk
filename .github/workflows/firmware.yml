# SPDX-License-Identifier: GPL-3.0-only
# Device firmware on Ubuntu with SLOOP's own build (tools/build.py) and
# JieLi's Linux toolchain, as the Felucca-family firmwares build.
# Matrix: the plain SLOOP baseline (proves the toolchain and prints the
# flash/RAM headroom) and, once present, the learn stages.
name: firmware
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    # the learn layer on SLOOP's host UI harness (gcc, no toolchain): the switch, keys, drills, lessons, screens
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps (SLOOP's generators need Pillow with raqm)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libraqm0 libfribidi0 libharfbuzz0b > /dev/null
          python3 -m pip install -q Pillow fonttools
      - name: Generated tables
        working-directory: sloop
        run: python3 tools/build.py --help > /dev/null && python3 -c "import sys; sys.path.insert(0,'tools'); import build; build.generate()"
      - name: Lessons
        run: python3 lessons/make_lessons.py && git diff --exit-code -- learn/lessons.c
      - name: Learn UI tests
        run: tools/host_tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: learn-host-screens
          path: build/host/*.ppm
  build:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: sloop-baseline-elite, board: smk37, model: elite, learn: 0, stage: 0 }
          - { name: sloop-baseline-fm1,   board: fm1,   model: "",    learn: 0, stage: 0 }
          - { name: learn-s1-elite,       board: smk37, model: elite, learn: 1, stage: 1 }
          - { name: learn-s1-fm1,         board: fm1,   model: "",    learn: 1, stage: 1 }
          - { name: learn-s2-elite,       board: smk37, model: elite, learn: 1, stage: 2 }
          - { name: learn-s2-fm1,         board: fm1,   model: "",    learn: 1, stage: 2 }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps (SLOOP needs Pillow with raqm)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libraqm0 libfribidi0 libharfbuzz0b > /dev/null
          python3 -m pip install -q Pillow fonttools
          python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
      - name: Toolchain + SDK cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-${{ hashFiles('tools/jieli-linux.sha256', 'tools/ci_deps.sh') }}
      - name: Toolchain + SDK files
        run: tools/ci_deps.sh
      - name: Build
        working-directory: sloop
        env:
          BOARD: ${{ matrix.board }}
          MODEL: ${{ matrix.model }}
          FELUCCA_LEARN: ${{ matrix.learn }}
          LEARN_STAGE: ${{ matrix.stage }}
        run: |
          set +e
          ./build.sh 2>&1 | tee ../build-${{ matrix.name }}.log
          st=${PIPESTATUS[0]}
          if [ "$st" != 0 ]; then   # the errors as annotations too (readable through the API when the log is not)
            grep -nE "error|Error|exceeds|undefined|overflow|FAIL" ../build-${{ matrix.name }}.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$st"
          fi
          ls -l build/*.fwsc
      - name: Sizes
        if: always()
        run: tools/ci_sizes.sh sloop/build/felucca.elf ${{ matrix.name }}
      - name: Headroom
        run: |
          { echo "### ${{ matrix.name }}"; echo; echo '```'; grep -E "image [0-9]+ B|RAM|pool|lowram|exceeds" build-${{ matrix.name }}.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E "image [0-9]+ B|RAM|pool|lowram|exceeds" build-${{ matrix.name }}.log | while IFS= read -r l; do echo "::notice title=${{ matrix.name }}::$l"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            sloop/build/*.fwsc
            build-${{ matrix.name }}.log
          if-no-files-found: error
