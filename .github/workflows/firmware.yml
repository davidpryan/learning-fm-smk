# SPDX-License-Identifier: GPL-3.0-only
# Device firmware on Ubuntu with SLOOP's own build (tools/build.py) and
# JieLi's Linux toolchain, as the Felucca-family firmwares build.
# Matrix: the plain SLOOP baseline (proves the toolchain and prints the
# flash/RAM headroom) and, once present, the learn stages.
name: firmware
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release X.Y (empty: a plain build). Makes the vX.Y tag, the install site and the GitHub release."
        required: false
        default: ""
env:
  REL_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host-tests:
    # the learn layer on SLOOP's host UI harness (gcc, no toolchain): the switch, keys, drills, lessons, screens
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps (SLOOP's generators need Pillow with raqm)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libraqm0 libfribidi0 libharfbuzz0b > /dev/null
          python3 -m pip install -q Pillow fonttools
      - name: Generated tables
        working-directory: sloop
        run: python3 tools/build.py --help > /dev/null && python3 -c "import sys; sys.path.insert(0,'tools'); import build; build.generate()"
      - name: Lessons
        run: python3 lessons/make_lessons.py && git diff --exit-code -- learn/lessons.c
      - name: Learn UI tests
        run: tools/host_tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: learn-host-screens
          path: build/host/*.ppm
  build:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: sloop-baseline-elite, board: smk37, model: elite, learn: 0, stage: 0 }
          - { name: sloop-baseline-fm1,   board: fm1,   model: "",    learn: 0, stage: 0 }
          - { name: learn-elite,          board: smk37, model: elite, learn: 1, stage: 4 }
          - { name: learn-fm1,            board: fm1,   model: "",    learn: 1, stage: 4 }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps (SLOOP needs Pillow with raqm)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libraqm0 libfribidi0 libharfbuzz0b > /dev/null
          python3 -m pip install -q Pillow fonttools
          python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
      - name: Toolchain + SDK cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-${{ hashFiles('tools/jieli-linux.sha256', 'tools/ci_deps.sh') }}
      - name: Toolchain + SDK files
        run: tools/ci_deps.sh
      - name: Build
        working-directory: sloop
        env:
          BOARD: ${{ matrix.board }}
          MODEL: ${{ matrix.model }}
          FELUCCA_LEARN: ${{ matrix.learn }}
          LEARN_STAGE: ${{ matrix.stage }}
        run: |
          set +e
          rel=""
          case "$REL_VERSION" in v[0-9].[0-9]*) rel="--release ${REL_VERSION#v}";; esac
          ./build.sh $rel 2>&1 | tee ../build-${{ matrix.name }}.log
          st=${PIPESTATUS[0]}
          if [ "$st" != 0 ]; then   # the errors as annotations too (readable through the API when the log is not)
            grep -nE "error|Error|exceeds|undefined|overflow|FAIL" ../build-${{ matrix.name }}.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$st"
          fi
          ls -l build/*.fwsc
      - name: Sizes
        if: always()
        run: tools/ci_sizes.sh sloop/build/felucca.elf ${{ matrix.name }}
      - name: Headroom
        run: |
          { echo "### ${{ matrix.name }}"; echo; echo '```'; grep -E "image [0-9]+ B|RAM|pool|lowram|exceeds" build-${{ matrix.name }}.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E "image [0-9]+ B|RAM|pool|lowram|exceeds" build-${{ matrix.name }}.log | while IFS= read -r l; do echo "::notice title=${{ matrix.name }}::$l"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            sloop/build/*.fwsc
            build-${{ matrix.name }}.log
          if-no-files-found: error

  site:
    # a tag vX.Y: the install site (one installer page per device) on GitHub Pages, and a release with the packages
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: learn-*
          path: pkgs
      - name: Site
        run: |
          set +e
          {
            ver="${REL_VERSION#v}"
            find pkgs -type f | head -20
            elite=$(find pkgs/learn-elite -name '*.fwsc' | head -1)
            fm1=$(find pkgs/learn-fm1 -name '*.fwsc' | head -1)
            python3 tools/make_site.py "$ver" site "$elite" "$fm1" && cp pkgs/learn-*/build-*.log site/ ; ls -l site
          } > site.log 2>&1
          st=$?
          cat site.log
          [ "$st" = 0 ] || { echo "::error title=site::$(tail -c 1500 site.log | tr '\n' ' ')"; exit "$st"; }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${REL_VERSION#v}"
          (cd site && zip -qr ../install-site-$ver.zip .)
          gh release create "$REL_VERSION" --target "$GITHUB_SHA" site/*.fwsc site/*.sha256 site/provenance.json install-site-$ver.zip \
            --title "Learn firmware $ver" \
            --notes "One firmware per device, four pages inside. Read docs/SAFETY.md and docs/FIRST-HARDWARE-TEST.md first. Install from the site (GitHub Pages, once enabled) or with SLOOP's installer: python3 sloop/tools/fm1_install.py <package>.fwsc (pip install mido python-rtmidi). Checksums in the .sha256 sidecars; provenance.json names the commit and the SLOOP upstream commit; install-site-$ver.zip is the site itself."
      - uses: actions/configure-pages@v5
        continue-on-error: true   # Pages must be enabled once in the repository settings (Source: GitHub Actions)
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
